[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-infrastructure-monitor"
version = "1.0.0"
description = "Predictive maintenance and anomaly detection for IT infrastructure logs"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Intelligent Infrastructure Monitor Capstone"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
  "streamlit>=1.35,<2",
  "plotly>=5.20,<7"
]

[project.scripts]
iim = "intelligent_infrastructure_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
